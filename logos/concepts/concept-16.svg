<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Channel Brains concept-16 "Half Brain, Half Play": left brain folds, right play triangle -->
  <rect x="56" y="115" width="400" height="282" rx="76" fill="#FF0000"/>
  <g>
    <!-- left half: brain lobe with rounded back -->
    <path d="M 126 256
             C 126 202 164 172 212 172
             L 246 172
             L 246 340
             L 212 340
             C 164 340 126 310 126 256 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
    <!-- fold cutouts on the brain half -->
    <g stroke="#FF0000" stroke-width="18" stroke-linecap="round" fill="none">
      <path d="M 164 208 C 190 202 198 226 184 244"/>
      <path d="M 170 276 C 196 269 201 292 187 308"/>
      <path d="M 214 186 C 216 216 210 244 200 266"/>
    </g>
    <!-- right half: play triangle with rounded corners -->
    <path d="M 264 188
             L 376 244
             C 390 251 390 261 376 268
             L 264 324 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
